<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1D6F63"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Heartworm Recovery Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky day header, bottom tab bar; cards only for the active log sections */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --sunk:#E3EBE8; --ink:#14302B; --muted:#5A716C; --line:#CFDBD7;
  --accent:#1D6F63; --accent-ink:#FFFFFF; --accent-soft:#D6ECE7;
  --red:#B8322A; --red-soft:#F9E1DE; --amber:#9A6513; --amber-soft:#F7ECD4; --green:#2F7A3E; --green-soft:#DDEFDF;
  --peak:#C9473D; --rise:#D9A441; --low:#7FB5A6; --restr:#B9C7C3;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1716; --surface:#16211F; --sunk:#1D2A28; --ink:#E4EEEB; --muted:#93A8A3; --line:#2A3A37;
  --accent:#4FB8A6; --accent-ink:#06201C; --accent-soft:#183B35;
  --red:#F07A6F; --red-soft:#3A1A17; --amber:#E2B05A; --amber-soft:#332714; --green:#7CC98A; --green-soft:#16301B;
  --peak:#D9574C; --rise:#C99A3E; --low:#3F7E70; --restr:#3A4A47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#16211F; --sunk:#1D2A28; --ink:#E4EEEB; --muted:#93A8A3; --line:#2A3A37;
  --accent:#4FB8A6; --accent-ink:#06201C; --accent-soft:#183B35;
  --red:#F07A6F; --red-soft:#3A1A17; --amber:#E2B05A; --amber-soft:#332714; --green:#7CC98A; --green-soft:#16301B;
  --peak:#D9574C; --rise:#C99A3E; --low:#3F7E70; --restr:#3A4A47; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dayno{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:.95;letter-spacing:-.02em}
.dayno small{font-size:.9rem;font-weight:500;color:var(--muted);letter-spacing:0;display:block;margin-bottom:4px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}
.datenav input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px;max-width:150px}
.zone{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-weight:700;font-size:.92rem}
.zone .dot{width:10px;height:10px;border-radius:50%;flex:none}
.z-peak{background:var(--red-soft);color:var(--red)} .z-peak .dot{background:var(--peak)}
.z-rise{background:var(--amber-soft);color:var(--amber)} .z-rise .dot{background:var(--rise)}
.z-low{background:var(--accent-soft);color:var(--accent)} .z-low .dot{background:var(--low)}
.z-restr{background:var(--sunk);color:var(--muted)} .z-restr .dot{background:var(--restr)}
.sync{font-size:.75rem;color:var(--muted)}

/* alerts */
.alert{border:2px solid var(--red);background:var(--red-soft);color:var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.alert h2{color:var(--red)}
.alert ul{margin:0;padding-left:20px}
.alert.warn{border-color:var(--amber);background:var(--amber-soft)} .alert.warn h2{color:var(--amber)}
.phones{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem}
.phones b{user-select:all}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.field{display:flex;flex-direction:column;gap:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.92rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.bad[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.meh[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#fff}
:root[data-theme="dark"] .chip.meh[aria-pressed="true"],:root[data-theme="dark"] .chip.bad[aria-pressed="true"]{color:#140A08}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.meh[aria-pressed="true"],:root:not([data-theme="light"]) .chip.bad[aria-pressed="true"]{color:#140A08}}

/* meds */
.med{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.med:first-of-type{border-top:0;padding-top:0}
.med .name{min-width:0}
.med .name b{display:block}
.med .name span{font-size:.85rem;color:var(--muted)}
.dose{width:86px;min-height:52px;border-radius:12px;border:2px dashed var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.dose .t{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.dose .v{font-family:var(--f-mono);font-size:.95rem}
.dose.given{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.dose.given .v{color:var(--green);font-weight:700}
.dose.due{border-color:var(--amber)}

/* breathing */
.rr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rrbox{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.rrbox .n{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.rrbox .n.hi{color:var(--red)}
.rrbox input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px}
.counter{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--sunk)}
.tapbtn{width:180px;height:180px;max-width:100%;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}
.tapbtn .big{font-size:3rem;line-height:1}
.tapbtn:active{transform:scale(.97)}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem}
.stepper .n{font-family:var(--f-mono);font-size:1.3rem;min-width:2ch;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px}

/* guide */
.tier{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface)}
.tier.t-red{border:2px solid var(--red)} .tier.t-red>h2{color:var(--red)}
.tier.t-amber{border:2px solid var(--amber)} .tier.t-amber>h2{color:var(--amber)}
.tier.t-green>h2{color:var(--green)}
.tier .grp{display:flex;flex-direction:column;gap:6px}
.tier ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.how{display:flex;flex-direction:column;gap:10px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ref{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.ref dt{font-family:var(--f-mono);font-weight:700}
.ref dd{margin:0}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tday{aspect-ratio:1;max-width:100%;border-radius:9px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.85rem;position:relative;color:var(--ink)}
.tday.peak{background:var(--peak);color:#fff} .tday.rise{background:var(--rise);color:#1b1305} .tday.low{background:var(--low);color:#06201C} .tday.restr{background:var(--restr)}
.tday.today{outline:3px solid var(--ink);outline-offset:2px}
.tday .lg{position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:currentColor}
.tday .al{position:absolute;top:3px;right:4px;font-size:.7rem;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.miles{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.miles li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.miles .d{font-family:var(--f-mono);font-weight:700;color:var(--accent)}

/* trends */
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.hrow:first-child{border-top:0}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.r{background:var(--red-soft);color:var(--red)} .pill.a{background:var(--amber-soft);color:var(--amber)} .pill.g{background:var(--green-soft);color:var(--green)}

/* setup */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:700;min-width:0}
.form input{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;color:var(--ink);font-weight:400;width:100%}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);min-height:52px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:7}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.lockcard input{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;font-size:1.1rem;color:var(--ink)}
</style>

</head><body><div class="wrap">
  <header class="top" id="top">
    <div class="toprow">
      <div class="dayno" id="dayno"><small id="dogline">Post-injection</small>Day 1</div>
      <div class="datenav">
        <button id="prev" aria-label="Previous day">‹</button>
        <input type="date" id="datepick" aria-label="Log date">
        <button id="next" aria-label="Next day">›</button>
      </div>
    </div>
    <div class="zone z-low" id="zone"><span class="dot"></span><span id="zonetxt">Loading…</span></div>
  </header>
  <main id="view"></main>
  <p class="sync" id="sync">Connecting…</p>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11l3 3 5-5"/></svg>Log</button>
  <button data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Watch for</button>
  <button data-tab="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Timeline</button>
  <button data-tab="trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg>Trends</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Setup</button>
</nav>
<div class="toast" id="toast" hidden></div>

<div class="lock" id="lock" hidden><form class="lockcard" id="lockform"><h2>Heartworm Recovery Log</h2><p class="muted">Enter the passcode to open the shared log.</p><input id="passin" type="password" autocomplete="current-password" aria-label="Passcode" placeholder="Passcode"><p id="lockmsg" style="color:var(--red);min-height:1.2em"></p><button class="btn" type="submit">Open log</button></form></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const todayStr=()=>ymd(new Date());

const DEFAULTS={dog:"",injDate:todayStr(),injNo:"",amTime:"08:00",pmTime:"20:00",
  traz:"300 mg",ster:"",sterDose:"",abx:"",abxDose:"",oth:"",othDose:"",vet:"",er:"",nextInj:""};
let settings={...DEFAULTS};
const days={};          // date -> record
const dirty=new Set();  // dates with unsent local edits
let cur=todayStr(), tab="today", db=null;

/* ---------- behaviour / symptom catalogue (sev: 0 expected, 1 call vet, 2 emergency) ---------- */
const BEHAV=[
  ["calm","Resting calmly",0],["sleepy","Sleepy but rousable",0],["sore","Stiff / sore lower back",0],["thirst","Drinking & peeing more (steroid)",0],["hungry","Extra hungry (steroid)",0],
  ["restless","Restless, won't settle",1],["pant","Panting while resting",1],["whine","Whining / vocalizing",1],["lick","Licking or biting injection site",1],["rise","Reluctant to get up",1],["hide","Hiding / withdrawn",1],["shiver","Shivering",1],["lethargy","Dull, uninterested in anything",1],["warm","Feels warm / possible fever",1],["cough1","Soft occasional cough",1],
  ["agit","Agitated despite sedative",2],["tremor","Tremors or twitching",2],["rigid","Muscle rigidity",2],["pupils","Very dilated pupils",2],["drool","Heavy drooling",2],["collapse","Collapse / can't stand",2],["unrouse","Can't be roused",2],["seize","Seizure",2],["belly","Swollen, painful belly",2]
];
const BMAP=Object.fromEntries(BEHAV.map(b=>[b[0],b]));

/* ---------- risk zones ---------- */
function zoneFor(n){
  if(n<1) return {k:"restr",t:"Before injection"};
  if(n<=4) return {k:"low",t:"Early recovery · sore back is normal"};
  if(n<=6) return {k:"rise",t:"Worms dying off · clot risk rising"};
  if(n<=21) return {k:"peak",t:"PEAK CLOT RISK (Days 7–21) · zero excitement"};
  if(n<=30) return {k:"rise",t:"Risk easing · strict rest continues"};
  if(n<=56) return {k:"restr",t:"Still restricted · leash only until vet clears"};
  return {k:"restr",t:"Ask your vet before loosening rest"};
}
const dayNum=s=>Math.round((parse(s)-parse(settings.injDate))/864e5)+1;

/* ---------- record helpers ---------- */
function rec(s){ if(!days[s]) days[s]={meds:{},beh:[],pee:0,poop:0}; const r=days[s]; r.meds=r.meds||{}; r.beh=r.beh||[]; return r }
function hasData(r){ if(!r) return false; return Object.keys(r.meds||{}).length||r.rrAM||r.rrPM||r.sedAM||r.sedPM||r.cough||(r.beh||[]).length||r.food||r.pee||r.poop||r.notes }
function flags(r){
  const red=[],amb=[]; if(!r) return {red,amb};
  const rr=Math.max(+r.rrAM||0,+r.rrPM||0);
  if(rr>40) red.push("Resting breathing "+rr+"/min (over 40)"); else if(rr>30) amb.push("Resting breathing "+rr+"/min. Recheck in 1 hour");
  if(r.sedAM==4||r.sedPM==4) red.push("Can't rouse / profound wobbliness");
  if(r.sedAM==1||r.sedPM==1) amb.push("Not settling on trazodone. Ask vet about dose");
  if(r.cough==="blood") red.push("Coughing up blood");
  if(r.cough==="frequent") amb.push("Frequent cough");
  if(r.effort==="labored") red.push("Labored / belly breathing");
  if(r.gumsAM==="bad"||r.gumsPM==="bad") red.push("Pale, gray or blue gums");
  if(r.stool==="black") red.push("Black, tarry stool");
  if(r.stool==="diarrhea") amb.push("Diarrhea");
  if((+r.vomit||0)>2) red.push("Vomited "+r.vomit+" times"); else if((+r.vomit||0)>0) amb.push("Vomited "+r.vomit+"×");
  if(r.food==="none") amb.push("Didn't eat");
  if(r.site==="hot") amb.push("Injection site hot, growing or oozing");
  if(r.rest==="breach") amb.push("Crate rest breached. Watch breathing closely next 24h");
  (r.beh||[]).forEach(k=>{const b=BMAP[k]; if(!b) return; if(b[2]===2) red.push(b[1]); else if(b[2]===1) amb.push(b[1])});
  return {red,amb};
}

/* ---------- persistence (Netlify API + passcode) ---------- */
const LS="hw-recovery-v1", PK="hw-passcode";
let pass=""; try{pass=localStorage.getItem(PK)||""}catch(e){}
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify({settings,days}))}catch(e){} }
function loadLocal(){ try{const j=JSON.parse(localStorage.getItem(LS)||"null"); if(j){Object.assign(settings,j.settings||{}); Object.assign(days,j.days||{})}}catch(e){} }
async function api(method,path,body){
  const r=await fetch("/api"+path,{method,headers:{"x-passcode":pass,"content-type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(r.status===401){ showLock("That passcode didn't work. Try again."); throw {code:"passcode"} }
  if(!r.ok) throw {code:"http "+r.status};
  return r.json();
}
const timers={};
function saveDay(s){
  dirty.add(s); saveLocal();
  clearTimeout(timers[s]);
  timers[s]=setTimeout(async()=>{
    try{ await api("PUT","/day/"+s,{...days[s],date:s}); setSync("Saved · shared with everyone using the passcode") }
    catch(e){ setSync("Couldn't save online ("+(e&&e.code||"error")+"). Kept on this device; will retry on your next change.") }
    finally{ dirty.delete(s) }
  },500);
}
async function saveSettings(){
  saveLocal();
  try{ await api("PUT","/settings",{...settings}); setSync("Saved") }catch(e){ setSync("Couldn't save settings ("+(e&&e.code||"error")+")") }
}
function setSync(t){ $("#sync").textContent=t }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,1800) }

/* ---------- header ---------- */

  const n=dayNum(cur), z=zoneFor(n);
  $("#dayno").innerHTML='<small>'+esc(settings.dog?settings.dog+" · post-injection":"Post-injection")+(cur===todayStr()?" · today":"")+'</small>'+(n>=1?"Day "+n:"Pre-injection");
  $("#zone").className="zone z-"+z.k; $("#zonetxt").textContent=z.t;
  $("#datepick").value=cur;
}

/* ---------- TODAY ---------- */
function chipRow(field,opts,r,multi){
  return '<div class="chips">'+opts.map(([v,l,cls])=>{
    const on=multi?(r[field]||[]).includes(v):r[field]===v;
    return '<button class="chip '+(cls||"")+'" data-f="'+field+'" data-v="'+v+'"'+(multi?' data-multi="1"':'')+' aria-pressed="'+on+'">'+esc(l)+'</button>'}).join("")+'</div>';
}
function doseBtn(key,slot,r){
  const v=r.meds[key]; const isToday=cur===todayStr();
  const due=!v&&isToday&&nowHM()>=(slot==="AM"?settings.amTime:settings.pmTime);
  return '<button class="dose'+(v?" given":"")+(due?" due":"")+'" data-dose="'+key+'" aria-label="'+slot+' dose '+(v?"given at "+v:"not given")+'"><span class="t">'+slot+(due?" · due":"")+'</span><span class="v">'+(v?"✓ "+esc(v):"tap")+'</span></button>';
}
function medRow(id,name,dose,r,note){
  return '<div class="med"><div class="name"><b>'+esc(name)+'</b><span>'+esc(dose||"Set dose in Setup")+(note?" · "+esc(note):"")+'</span></div>'+doseBtn(id+"AM","AM",r)+doseBtn(id+"PM","PM",r)+'</div>';
}

  h+='<section class="sec"><h2>Injection site &amp; rest</h2>'+

function stepper(k,label,r){ return '<div class="field"><span class="label">'+label+'</span><div class="stepper"><button data-step="'+k+'" data-d="-1" aria-label="Less">−</button><span class="n">'+(+r[k]||0)+'</span><button data-step="'+k+'" data-d="1" aria-label="More">+</button></div></div>' }
function phones(){
  const p=[]; if(settings.er) p.push('ER vet: <b>'+esc(settings.er)+'</b>'); if(settings.vet) p.push('Your vet: <b>'+esc(settings.vet)+'</b>');
  p.push('Pet Poison Line (ASPCA): <b>888-426-4435</b>');
  return '<div class="phones">'+p.map(x=>"<span>"+x+"</span>").join("")+'</div>'+(settings.er?'':'<p class="muted" style="font-size:.85rem">Add your vet numbers in Setup.</p>');
}

/* breath counter */
let tapState=null;
function tapHandler(){
  const n=$("#tapn"), sub=$("#tapsub"), msg=$("#tapmsg");
  if(!tapState){
    tapState={count:0,end:Date.now()+30000};
    n.textContent="0"; sub.textContent="30s left"; msg.textContent="Tap for each breath.";
    tapState.iv=setInterval(()=>{
      const left=Math.ceil((tapState.end-Date.now())/1000);
      if(left<=0){
        clearInterval(tapState.iv);
        const rate=tapState.count*2; const slot=new Date().getHours()<14?"AM":"PM";
        const r=rec(cur); r["rr"+slot]=rate; saveDay(cur); tapState=null;
        render(); toast(rate+" breaths/min saved to "+slot);
      } else sub.textContent=left+"s left";
    },250);
    return;
  }
  tapState.count++; n.textContent=tapState.count;
}

/* ---------- TIMELINE ---------- */

  const total=63; let cells="";
  const tn=dayNum(todayStr());
  for(let i=1;i<=total;i++){
    const s=addDays(settings.injDate,i-1), z=zoneFor(i), r=days[s], fl=flags(r);
    const al=fl.red.length?"!!":fl.amb.length?"!":"";
    cells+='<button class="tday '+z.k+(i===tn?" today":"")+'" data-go="'+s+'" aria-label="Day '+i+', '+s+'">'+i+(al?'<span class="al">'+al+'</span>':'')+(hasData(r)?'<span class="lg"></span>':'')+'</button>';
  }
  const ms=[[1,"Injection day. Back soreness starts."],[5,"Worms die off. Clot risk begins to rise."],[7,"Peak clot risk window opens. Check breathing 3× a day."],[10,"Highest-risk stretch (days 7–10)."],[21,"Peak window closes. Rest rules don't change."],[30,"If this was injection #1, doses #2 and #3 are often due around now"+(settings.nextInj?" (your date: "+settings.nextInj+")":"")+"."],[42,"Typical end of strict rest after the final injection is 6–8 weeks. Wait for vet clearance."]];

    '<div class="legend"><span><i style="background:var(--low)"></i>Early</span><span><i style="background:var(--rise)"></i>Rising / easing</span><span><i style="background:var(--peak)"></i>Peak risk</span><span><i style="background:var(--restr)"></i>Still restricted</span></div>'+
    '<div class="tl">'+cells+'</div><p class="muted" style="font-size:.85rem">Dot = logged. ! = vet-call flag, !! = emergency flag. Tap a day to open its log.</p></section>'+

}

/* ---------- TRENDS ---------- */
function renderTrends(){
  const keys=Object.keys(days).filter(k=>hasData(days[k])).sort();
  if(!keys.length){ $("#view").innerHTML='<section class="sec"><h2>No entries yet</h2><p class="muted">Log breathing, meds or symptoms on the Log tab and your trend chart appears here.</p></section>'; return }
  const pts=keys.map(k=>({k,n:dayNum(k),v:Math.max(+days[k].rrAM||0,+days[k].rrPM||0)})).filter(p=>p.v>0);
  const W=600,H=220,L=36,R=12,T=14,B=30;
  const maxD=Math.max(21,...pts.map(p=>p.n)), minD=1, maxV=Math.max(50,...pts.map(p=>p.v));
  const x=n=>L+(n-minD)/(maxD-minD)*(W-L-R), y=v=>T+(1-v/maxV)*(H-T-B);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Resting breathing rate by day">';
  svg+='<rect x="'+x(7)+'" y="'+T+'" width="'+Math.max(0,x(Math.min(21,maxD))-x(7))+'" height="'+(H-T-B)+'" fill="var(--red-soft)"/>';
  [0,10,20,30,40,50].filter(v=>v<=maxV).forEach(v=>{svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">'+v+'</text>'});
  svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(40)+'" y2="'+y(40)+'" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(y(40)-5)+'" text-anchor="end" font-size="11" fill="var(--red)" font-family="JetBrains Mono,monospace">40 emergency</text>';
  for(let d=1;d<=maxD;d+=(maxD>35?7:3)) svg+='<text x="'+x(d)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">D'+d+'</text>';
  if(pts.length>1){ svg+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+pts.map(p=>x(p.n)+","+y(p.v)).join(" ")+'"/>' }
  pts.forEach((p,i)=>{ svg+='<circle cx="'+x(p.n)+'" cy="'+y(p.v)+'" r="'+(i===pts.length-1?5:3.5)+'" fill="'+(p.v>40?"var(--red)":"var(--accent)")+'"/>' });
  svg+='</svg>';
  const rows=keys.slice().reverse().map(k=>{const r=days[k],fl=flags(r);const rr=Math.max(+r.rrAM||0,+r.rrPM||0);const dosesGiven=Object.values(r.meds||{}).filter(Boolean).length;
    const pill=fl.red.length?'<span class="pill r">Emergency flag</span>':fl.amb.length?'<span class="pill a">'+fl.amb.length+' to mention</span>':'<span class="pill g">No flags</span>';
    return '<button class="hrow" data-go="'+k+'"><span class="mono"><b>D'+dayNum(k)+'</b><br><span class="muted" style="font-size:.8rem">'+k.slice(5)+'</span></span><span style="min-width:0">'+(rr?rr+' breaths/min · ':'')+dosesGiven+' doses logged'+(r.sedAM||r.sedPM?' · sedation '+(r.sedAM||"–")+'/'+(r.sedPM||"–"):'')+'</span>'+pill+'</button>'}).join("");
  $("#view").innerHTML='<div class="wrap" style="gap:16px"><section class="sec"><div class="sechead"><h2>Resting breathing</h2><span class="label">highest reading per day</span></div>'+(pts.length?'<div class="chartbox">'+svg+'</div><p class="muted" style="font-size:.85rem">Shaded band is the Day 7–21 peak window. A steady climb matters even below 40.</p>':'<p class="muted">No breathing counts yet.</p>')+'</section>'+
    '<section class="sec"><h2>Daily summary</h2><div class="hist">'+rows+'</div></section></div>';
}

/* ---------- render + events ---------- */
function render(){
  renderHeader();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  $("#top").querySelector(".datenav").style.visibility=tab==="today"?"visible":"hidden";
  ({today:renderToday,watch:renderWatch,timeline:renderTimeline,trends:renderTrends,setup:renderSetup})[tab]();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; if(tab==="today") {} render(); window.scrollTo(0,0); return }
  if(t.id==="prev"){ cur=addDays(cur,-1); render(); return }
  if(t.id==="next"){ cur=addDays(cur,1); render(); return }
  if(t.id==="tapbtn"){ tapHandler(); return }
  if(t.dataset.go){ cur=t.dataset.go; tab="today"; render(); window.scrollTo(0,0); return }
  const r=rec(cur);
  if(t.dataset.dose){ const k=t.dataset.dose; if(r.meds[k]) delete r.meds[k]; else { r.meds[k]=cur===todayStr()?nowHM():"given"; toast("Logged "+r.meds[k]) } saveDay(cur); render(); return }
  if(t.dataset.f){ const f=t.dataset.f,v=t.dataset.v; r[f]=r[f]===v?null:v; saveDay(cur); render(); return }
  if(t.dataset.beh){ const k=t.dataset.beh,i=r.beh.indexOf(k); if(i>=0) r.beh.splice(i,1); else r.beh.push(k); saveDay(cur); render(); return }
  if(t.dataset.step){ const k=t.dataset.step; r[k]=Math.max(0,(+r[k]||0)+(+t.dataset.d)); saveDay(cur); render(); return }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.text){ rec(cur)[t.dataset.text]=t.value; saveDay(cur) }
  if(t.dataset.set){ settings[t.dataset.set]=t.value; clearTimeout(saveSettings._t); saveSettings._t=setTimeout(saveSettings,600); renderHeader() }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="datepick"&&t.value){ cur=t.value; render() }
  if(t.dataset.num){ const v=t.value===""?null:Math.max(0,Math.min(200,+t.value)); rec(cur)[t.dataset.num]=v; saveDay(cur); render() }
});

/* ---------- boot ---------- */
function showLock(msg){
  const l=$("#lock"); l.hidden=false; $("#lockmsg").textContent=msg||""; setTimeout(()=>$("#passin").focus(),50);
}
async function pull(){
  const ae=document.activeElement;
  try{
    const j=await api("GET","");
    if(j.settings) Object.assign(settings,j.settings);
    Object.entries(j.days||{}).forEach(([k,v])=>{ if(!dirty.has(k)&&v) days[k]=v });
    saveLocal(); setSync("Synced "+nowHM());
    if(!(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"))&&!tapState) render();
  }catch(e){ if(e&&e.code!=="passcode") setSync("Offline. Showing what's saved on this device.") }
}
$("#lockform").addEventListener("submit",async e=>{
  e.preventDefault(); pass=$("#passin").value.trim(); if(!pass) return;
  try{localStorage.setItem(PK,pass)}catch(err){}
  $("#lock").hidden=true; await pull();
});
loadLocal(); render();
if(!pass) showLock(); else pull();
setInterval(()=>{ if(pass&&document.visibilityState==="visible") pull() },30000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&pass) pull() });
})();
</script>
</body></html>
