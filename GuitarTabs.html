<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TabBook · Chords &amp; Strumming</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b140f; --surface: #241b14; --card: #2c2118; --border: #3d2e20;
    --accent: #e3a948; --green: #8fc97c; --red: #e0685c; --text: #f3e9da; --muted: #9c8b76;
    --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif; --display: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; height: 100dvh; overflow: hidden; }
  .view { display: none; flex-direction: column; height: 100%; }
  .view.active { display: flex; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 8px; }
  .app-title { font-family: var(--display); font-size: 18px; font-weight: 800; color: var(--accent); }
  .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .icon-btn:active { opacity: 0.6; }
  .icon-btn.primary { background: rgba(227,169,72,0.15); border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger { background: rgba(224,104,92,0.1); border-color: rgba(224,104,92,0.4); color: #ff9a8d; }

  .search-bar { padding: 10px 14px; flex-shrink: 0; }
  .search-bar input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; outline: none; }
  .search-bar input:focus { border-color: var(--accent); }

  .song-list { flex: 1; overflow-y: auto; padding: 0 14px 14px; -webkit-overflow-scrolling: touch; }
  .song-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
  .song-card:active { opacity: 0.7; }
  .song-card-title { font-weight: 700; font-size: 15px; }
  .song-card-artist { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .song-card-meta { display: flex; gap: 6px; flex-shrink: 0; }
  .key-badge, .capo-badge { font-family: var(--mono); font-size: 10px; padding: 4px 8px; border-radius: 8px; background: rgba(227,169,72,0.1); border: 1px solid rgba(227,169,72,0.3); color: var(--accent); white-space: nowrap; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13px; }

  .song-header { flex: 1; min-width: 0; text-align: center; }
  .song-title { font-family: var(--display); font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-artist { font-size: 11px; color: var(--muted); }

  .controls-bar { display: flex; gap: 14px; padding: 8px 14px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; scrollbar-width: none; }
  .controls-bar::-webkit-scrollbar { display: none; }
  .control-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .control-label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .control-group button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; line-height: 1; }
  .control-val { font-family: var(--mono); font-size: 13px; min-width: 24px; text-align: center; color: var(--accent); font-weight: 600; }

  .autoscroll-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .autoscroll-btn { padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .autoscroll-btn.active { background: rgba(227,169,72,0.15); border-color: var(--accent); color: var(--accent); }
  .autoscroll-bar input[type=range] { flex: 1; accent-color: var(--accent); }

  .tab-body { flex: 1; overflow-y: auto; padding: 14px 16px 40px; -webkit-overflow-scrolling: touch; }
  .tab-section { margin-bottom: 22px; }
  .section-name { font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .strum-widget { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .strum-row { display: flex; gap: 4px; margin-bottom: 8px; }
  .strum-cell { flex: 1; text-align: center; padding: 6px 0; border-radius: 6px; background: rgba(255,255,255,0.03); font-size: 15px; color: var(--muted); transition: background 0.15s, color 0.15s; }
  .strum-cell.active { background: var(--accent); color: #1b140f; }
  .strum-controls { display: flex; align-items: center; gap: 8px; }
  .strum-play { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .bpm-slider { flex: 1; accent-color: var(--accent); }
  .bpm-val { font-family: var(--mono); font-size: 12px; min-width: 22px; color: var(--accent); }
  .bpm-label { font-size: 10px; color: var(--muted); }

  .tab-lines { font-family: var(--mono); }
  .tab-line { display: flex; flex-wrap: wrap; margin-bottom: 18px; line-height: 1.4; }
  .chord-word { position: relative; display: inline-block; padding-top: 16px; white-space: pre; }
  .chord-tag { position: absolute; top: 0; left: 0; color: var(--accent); font-weight: 700; font-size: 0.85em; cursor: pointer; min-height: 1em; }
  .lyric { color: var(--text); }

  .edit-form { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .edit-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .edit-form input, .edit-form textarea { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-family: var(--sans); outline: none; }
  .edit-form textarea { font-family: var(--mono); resize: vertical; min-height: 220px; line-height: 1.5; }
  .edit-form input:focus, .edit-form textarea:focus { border-color: var(--accent); }
  .row2 { display: flex; gap: 10px; }
  .row2 label { flex: 1; }
  .help-text { font-size: 11px; color: var(--muted); line-height: 1.6; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-overlay.active { display: flex; }
  .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 160px; }
  .chord-diagram-title { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--accent); }
  .no-diagram { color: var(--muted); font-size: 12px; padding: 10px; }
  .dg-grid { position: relative; }
  .dg-string { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); }
  .dg-fret { position: absolute; left: 0; right: 0; height: 1px; background: var(--muted); }
  .dg-fret:first-child { height: 3px; background: var(--text); }
  .dg-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translate(-50%,-50%); }
  .dg-label { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .modal-close { padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<div id="homeView" class="view active">
  <div class="topbar">
    <div class="app-title">🎸 TabBook</div>
    <button class="icon-btn primary" onclick="openNewSong()">+ New</button>
  </div>
  <div class="search-bar"><input id="searchInput" type="text" placeholder="Search songs or artists..."></div>
  <div id="songList" class="song-list"></div>
</div>

<div id="songView" class="view">
  <div class="topbar">
    <button class="icon-btn" onclick="closeSong()">← Back</button>
    <div class="song-header">
      <div id="songTitle" class="song-title"></div>
      <div id="songArtist" class="song-artist"></div>
    </div>
    <button class="icon-btn" onclick="openEditSong()">✎ Edit</button>
  </div>
  <div class="controls-bar">
    <div class="control-group"><span class="control-label">Key</span><span id="keyVal" class="control-val"></span></div>
    <div class="control-group"><span class="control-label">Capo</span><button onclick="changeCapo(-1)">−</button><span id="capoVal" class="control-val"></span><button onclick="changeCapo(1)">+</button></div>
    <div class="control-group"><span class="control-label">Transpose</span><button onclick="changeTranspose(-1)">−</button><span id="transposeVal" class="control-val"></span><button onclick="changeTranspose(1)">+</button></div>
    <div class="control-group"><span class="control-label">Size</span><button onclick="changeFontSize(-1)">A−</button><button onclick="changeFontSize(1)">A+</button></div>
    <div class="control-group"><button class="icon-btn danger" onclick="deleteCurrentSong()">🗑 Delete</button></div>
  </div>
  <div class="autoscroll-bar">
    <button id="autoscrollBtn" class="autoscroll-btn" onclick="toggleAutoscroll(this)">▶ Autoscroll</button>
    <input type="range" min="1" max="10" value="2" oninput="setAutoscrollSpeed(this.value)">
  </div>
  <div id="tabBody" class="tab-body"></div>
</div>

<div id="editView" class="view">
  <div class="topbar">
    <button class="icon-btn" onclick="cancelEdit()">✕ Cancel</button>
    <div class="app-title">Edit Song</div>
    <button class="icon-btn primary" onclick="saveSongForm()">✓ Save</button>
  </div>
  <div class="edit-form">
    <label>Title <input id="editTitle" type="text" placeholder="Song title"></label>
    <label>Artist <input id="editArtist" type="text" placeholder="Artist"></label>
    <div class="row2">
      <label>Key <input id="editKey" type="text" placeholder="G"></label>
      <label>Capo <input id="editCapo" type="number" min="0" max="11" value="0"></label>
    </div>
    <label>Tab <textarea id="editTab" rows="14" placeholder="#section Verse 1&#10;#strum D - D U - D U -&#10;[G]Amazing [C]grace, how [G]sweet the sound"></textarea></label>
    <div class="help-text">Use <code>[Chord]lyric</code> inline to attach a chord to a word. Start a new section with <code>#section Name</code>. Define its strumming pattern with <code>#strum</code> followed by 8 tokens of <code>D</code> (down), <code>U</code> (up) or <code>-</code> (rest), one per eighth-note in the measure.</div>
  </div>
</div>

<div id="chordModal" class="modal-overlay" onclick="if(event.target===this) hideChordModal()">
  <div class="modal-card">
    <div id="chordModalBody"></div>
    <button class="modal-close" onclick="hideChordModal()">Close</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'tabbook_songs_v1';
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_MAP = { Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#' };

const CHORD_SHAPES = {
  'C':   [-1,3,2,0,1,0], 'C7':  [-1,3,2,3,1,0],
  'D':   [-1,-1,0,2,3,2], 'D7':  [-1,-1,0,2,1,2], 'Dm': [-1,-1,0,2,3,1],
  'E':   [0,2,2,1,0,0], 'E7':  [0,2,0,1,0,0], 'Em': [0,2,2,0,0,0], 'Em7': [0,2,0,0,0,0],
  'F':   [1,3,3,2,1,1],
  'G':   [3,2,0,0,0,3], 'G7':  [3,2,0,0,0,1],
  'A':   [-1,0,2,2,2,0], 'A7':  [-1,0,2,0,2,0], 'Am': [-1,0,2,2,1,0], 'Am7': [-1,0,2,0,1,0],
  'B':   [-1,2,4,4,4,2], 'B7':  [-1,2,1,2,0,2], 'Bm': [-1,2,4,4,3,2],
};

const DEFAULT_SONGS = [
  { title: 'Amazing Grace', artist: 'Traditional', key: 'G', capo: 0, tab:
`#section Verse 1
#strum D - D U - D U -
[G]Amazing [C]grace, how [G]sweet the sound
That [G]saved a [D]wretch like [G]me
I [G]once was [C]lost, but [G]now am found
Was [Em]blind, but [D]now I [G]see

#section Verse 2
#strum D - D U - D U -
'Twas [G]grace that [C]taught my [G]heart to fear
And [G]grace my [D]fears re[G]lieved
How [G]precious [C]did that [G]grace appear
The [Em]hour I [D]first be[G]lieved` },
  { title: 'Oh! Susanna', artist: 'Stephen Foster (Traditional)', key: 'D', capo: 0, tab:
`#section Verse 1
#strum D D U D D U D D
I [D]come from Alabama with my [G]banjo on my [D]knee
I'm [D]going to Louisiana, my [A]true love for to [D]see
It [D]rained all night the day I left, the [G]weather it was [D]dry
The [D]sun so hot I froze to death; Su[A]sanna, don't you [D]cry

#section Chorus
#strum D D U D D U D D
Oh, [D]Susanna, don't you [A]cry for me
For I [D]come from Alabama with my [G]banjo on my [D]knee` },
  { title: 'Scarborough Fair', artist: 'Traditional (English folk)', key: 'Am', capo: 0, tab:
`#section Verse 1
#strum D - U D - U D -
[Am]Are you going to [C]Scarborough [G]Fair
[Am]Parsley, sage, rose[C]mary and [Am]thyme
[Am]Remember me to [C]one who lives [G]there
For [Am]once she was a [C]true love of [Am]mine` },
  { title: 'Auld Lang Syne', artist: 'Traditional (Robert Burns)', key: 'G', capo: 0, tab:
`#section Verse 1
#strum D - D U - D U -
Should [G]auld acquaintance [C]be for[G]got
And [G]never brought to [D]mind
Should [G]auld acquaintance [C]be for[G]got
And [G]days of auld lang [D]syne

#section Chorus
#strum D - D U - D U -
For [G]auld lang [C]syne, my [G]dear
For [D]auld lang [G]syne
We'll [G]take a cup o' [C]kindness [G]yet
For [D]auld lang [G]syne` },
];

let songs = [];
let currentSongId = null;
let editingSongId = null;
let autoScrollOn = false, autoScrollTimer = null, autoScrollSpeed = 2;
let fontSize = 15;
let audioCtx = null;
let activePlay = null;

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }

function loadSongs() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { songs = JSON.parse(raw); return; } catch (e) { /* fall through to defaults */ }
  }
  songs = DEFAULT_SONGS.map((s, i) => ({ id: 'default-' + i, transpose: 0, ...s }));
  saveSongs();
}
function saveSongs() { localStorage.setItem(STORAGE_KEY, JSON.stringify(songs)); }
function getSongById(id) { return songs.find(s => s.id === id); }
function getCurrentSong() { return getSongById(currentSongId); }

function parseLine(line) {
  const positions = [];
  const re = /\[([^\]]*)\]/g;
  let m;
  while ((m = re.exec(line))) positions.push({ idx: m.index, len: m[0].length, chord: m[1] });
  if (positions.length === 0) return [{ chord: null, text: line }];
  const segs = [];
  if (positions[0].idx > 0) segs.push({ chord: null, text: line.slice(0, positions[0].idx) });
  for (let i = 0; i < positions.length; i++) {
    const start = positions[i].idx + positions[i].len;
    const end = i + 1 < positions.length ? positions[i + 1].idx : line.length;
    segs.push({ chord: positions[i].chord, text: line.slice(start, end) });
  }
  return segs;
}

function parseTabText(text) {
  const lines = (text || '').split('\n');
  const sections = [];
  let current = null;
  for (const raw of lines) {
    const line = raw.replace(/\r$/, '');
    if (/^\s*$/.test(line)) continue;
    if (/^#section\s+/i.test(line)) {
      current = { name: line.replace(/^#section\s+/i, '').trim(), strum: null, lines: [] };
      sections.push(current);
      continue;
    }
    if (/^#strum\s+/i.test(line)) {
      if (!current) { current = { name: '', strum: null, lines: [] }; sections.push(current); }
      current.strum = line.replace(/^#strum\s+/i, '').trim().split(/\s+/)
        .map(t => t.toUpperCase()).map(t => (t === 'D' || t === 'U') ? t : '-');
      continue;
    }
    if (!current) { current = { name: '', strum: null, lines: [] }; sections.push(current); }
    current.lines.push(parseLine(line));
  }
  return sections;
}

function transposeChord(chord, semitones) {
  if (!semitones) return chord;
  const m = chord.match(/^([A-G])(#|b)?(.*)$/);
  if (!m) return chord;
  let noteName = m[1] + (m[2] || '');
  if (FLAT_MAP[noteName]) noteName = FLAT_MAP[noteName];
  const idx = SHARPS.indexOf(noteName);
  if (idx === -1) return chord;
  return SHARPS[(idx + semitones + 120) % 12] + m[3];
}

function renderChordDiagram(name, shape) {
  const width = 120, height = 100;
  const stringGap = width / 5;
  const fretGap = (height - 10) / 4;
  let strings = '', frets = '', dots = '', labels = '';
  for (let s = 0; s < 6; s++) strings += `<div class="dg-string" style="left:${s * stringGap}px"></div>`;
  for (let f = 0; f < 5; f++) frets += `<div class="dg-fret" style="top:${10 + f * fretGap}px"></div>`;
  shape.forEach((val, s) => {
    const x = s * stringGap;
    if (val === -1) labels += `<div class="dg-label" style="left:${x}px">x</div>`;
    else if (val === 0) labels += `<div class="dg-label" style="left:${x}px">o</div>`;
    else dots += `<div class="dg-dot" style="left:${x}px; top:${10 + (val - 0.5) * fretGap}px"></div>`;
  });
  return `<div class="chord-diagram-title">${escapeHtml(name)}</div>
    <div style="position:relative;height:14px;width:${width}px;">${labels}</div>
    <div class="dg-grid" style="width:${width}px;height:${height}px;">${strings}${frets}${dots}</div>`;
}

function showChordModal(name) {
  const shape = CHORD_SHAPES[name];
  document.getElementById('chordModalBody').innerHTML = shape
    ? renderChordDiagram(name, shape)
    : `<div class="chord-diagram-title">${escapeHtml(name)}</div><div class="no-diagram">No diagram available</div>`;
  document.getElementById('chordModal').classList.add('active');
}
function hideChordModal() { document.getElementById('chordModal').classList.remove('active'); }

function renderTabLine(song, segs) {
  const t = song.transpose || 0;
  const html = segs.map(seg => {
    const chordName = seg.chord ? transposeChord(seg.chord, t) : null;
    const chordSpan = chordName
      ? `<span class="chord-tag" onclick="showChordModal('${escapeAttr(chordName)}')">${escapeHtml(chordName)}</span>`
      : `<span class="chord-tag"></span>`;
    const text = escapeHtml(seg.text) || ' ';
    return `<span class="chord-word">${chordSpan}<span class="lyric">${text}</span></span>`;
  }).join('');
  return `<div class="tab-line">${html}</div>`;
}

function renderStrumRow(pattern, sIdx) {
  const cells = pattern.map((tok, i) =>
    `<div class="strum-cell" data-i="${i}">${tok === 'D' ? '↓' : tok === 'U' ? '↑' : '·'}</div>`).join('');
  return `<div class="strum-widget">
    <div class="strum-row" id="strumrow-${sIdx}">${cells}</div>
    <div class="strum-controls">
      <button class="strum-play" onclick="toggleStrumPlay(${sIdx}, this)">▶ Play</button>
      <input type="range" min="50" max="160" value="90" class="bpm-slider" id="bpm-${sIdx}" oninput="updateBpmDisplay(this, ${sIdx})">
      <span class="bpm-val" id="bpmval-${sIdx}">90</span><span class="bpm-label">BPM</span>
    </div>
  </div>`;
}

function renderSection(song, section, sIdx) {
  const strumHtml = section.strum ? renderStrumRow(section.strum, sIdx) : '';
  const linesHtml = section.lines.map(segs => renderTabLine(song, segs)).join('');
  return `<div class="tab-section">
    ${section.name ? `<div class="section-name">${escapeHtml(section.name)}</div>` : ''}
    ${strumHtml}
    <div class="tab-lines">${linesHtml}</div>
  </div>`;
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderHome() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const list = songs.filter(s => (s.title + ' ' + (s.artist || '')).toLowerCase().includes(q));
  document.getElementById('songList').innerHTML = list.map(s => `
    <div class="song-card" onclick="openSong('${s.id}')">
      <div class="song-card-main">
        <div class="song-card-title">${escapeHtml(s.title)}</div>
        <div class="song-card-artist">${escapeHtml(s.artist || 'Unknown')}</div>
      </div>
      <div class="song-card-meta">
        <span class="key-badge">${escapeHtml(s.key || '-')}</span>
        ${s.capo ? `<span class="capo-badge">Capo ${s.capo}</span>` : ''}
      </div>
    </div>`).join('') || `<div class="empty-state">No songs found. Tap + New to add one.</div>`;
}

function renderSongView() {
  const song = getCurrentSong();
  if (!song) return;
  document.getElementById('songTitle').textContent = song.title;
  document.getElementById('songArtist').textContent = song.artist || '';
  document.getElementById('keyVal').textContent = song.key || '-';
  document.getElementById('capoVal').textContent = song.capo || 0;
  const tr = song.transpose || 0;
  document.getElementById('transposeVal').textContent = (tr > 0 ? '+' : '') + tr;
  const sections = parseTabText(song.tab);
  const tabBody = document.getElementById('tabBody');
  tabBody.innerHTML = sections.map((sec, i) => renderSection(song, sec, i)).join('');
  tabBody.style.fontSize = fontSize + 'px';
}

function openSong(id) { stopStrumPlay(); stopAutoscroll(); currentSongId = id; showView('songView'); renderSongView(); }
function closeSong() { stopStrumPlay(); stopAutoscroll(); currentSongId = null; showView('homeView'); renderHome(); }

function changeCapo(d) { const s = getCurrentSong(); s.capo = Math.max(0, (s.capo || 0) + d); saveSongs(); renderSongView(); }
function changeTranspose(d) { const s = getCurrentSong(); s.transpose = Math.max(-11, Math.min(11, (s.transpose || 0) + d)); saveSongs(); renderSongView(); }
function changeFontSize(d) { fontSize = Math.max(11, Math.min(26, fontSize + d)); document.getElementById('tabBody').style.fontSize = fontSize + 'px'; }

function toggleAutoscroll(btn) {
  autoScrollOn = !autoScrollOn;
  btn.classList.toggle('active', autoScrollOn);
  btn.textContent = autoScrollOn ? '⏸ Scrolling' : '▶ Autoscroll';
  if (autoScrollOn) {
    autoScrollTimer = setInterval(() => {
      const el = document.getElementById('tabBody');
      el.scrollTop += autoScrollSpeed;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight) stopAutoscroll();
    }, 60);
  } else {
    clearInterval(autoScrollTimer);
  }
}
function stopAutoscroll() {
  autoScrollOn = false;
  clearInterval(autoScrollTimer);
  const btn = document.getElementById('autoscrollBtn');
  if (btn) { btn.classList.remove('active'); btn.textContent = '▶ Autoscroll'; }
}
function setAutoscrollSpeed(v) { autoScrollSpeed = parseFloat(v); }

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function clickSound(isDown) {
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = isDown ? 220 : 440;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.25, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.1);
}

function updateBpmDisplay(el, sIdx) {
  document.getElementById('bpmval-' + sIdx).textContent = el.value;
  const key = currentSongId + '-' + sIdx;
  if (activePlay && activePlay.key === key) {
    const btn = activePlay.btn;
    stopStrumPlay();
    toggleStrumPlay(sIdx, btn);
  }
}

function toggleStrumPlay(sIdx, btn) {
  const key = currentSongId + '-' + sIdx;
  if (activePlay && activePlay.key === key) { stopStrumPlay(); return; }
  stopStrumPlay();
  const song = getCurrentSong();
  const sections = parseTabText(song.tab);
  const pattern = sections[sIdx] && sections[sIdx].strum;
  if (!pattern) return;
  const bpm = parseInt(document.getElementById('bpm-' + sIdx).value) || 90;
  const stepMs = (60 / bpm / 2) * 1000;
  let i = 0;
  btn.textContent = '⏹ Stop';
  function tick() {
    document.querySelectorAll(`#strumrow-${sIdx} .strum-cell`).forEach(c => c.classList.remove('active'));
    const cell = document.querySelector(`#strumrow-${sIdx} .strum-cell[data-i="${i}"]`);
    if (cell) cell.classList.add('active');
    const tok = pattern[i];
    if (tok === 'D') clickSound(true);
    else if (tok === 'U') clickSound(false);
    i = (i + 1) % pattern.length;
  }
  tick();
  const id = setInterval(tick, stepMs);
  activePlay = { key, id, btn };
}
function stopStrumPlay() {
  if (!activePlay) return;
  clearInterval(activePlay.id);
  if (activePlay.btn) activePlay.btn.textContent = '▶ Play';
  document.querySelectorAll('.strum-cell.active').forEach(c => c.classList.remove('active'));
  activePlay = null;
}

function openNewSong() {
  editingSongId = null;
  document.getElementById('editTitle').value = '';
  document.getElementById('editArtist').value = '';
  document.getElementById('editKey').value = '';
  document.getElementById('editCapo').value = 0;
  document.getElementById('editTab').value = '#section Verse 1\n#strum D - D U - D U -\n[G]Type your [C]lyrics [G]here\n';
  showView('editView');
}
function openEditSong() {
  editingSongId = currentSongId;
  const song = getCurrentSong();
  document.getElementById('editTitle').value = song.title || '';
  document.getElementById('editArtist').value = song.artist || '';
  document.getElementById('editKey').value = song.key || '';
  document.getElementById('editCapo').value = song.capo || 0;
  document.getElementById('editTab').value = song.tab || '';
  showView('editView');
}
function saveSongForm() {
  const title = document.getElementById('editTitle').value.trim();
  if (!title) { alert('Title is required'); return; }
  const data = {
    title,
    artist: document.getElementById('editArtist').value.trim(),
    key: document.getElementById('editKey').value.trim(),
    capo: parseInt(document.getElementById('editCapo').value) || 0,
    tab: document.getElementById('editTab').value,
  };
  if (editingSongId) {
    Object.assign(getSongById(editingSongId), data);
  } else {
    const song = { id: 's' + Date.now(), transpose: 0, ...data };
    songs.push(song);
    editingSongId = song.id;
  }
  saveSongs();
  currentSongId = editingSongId;
  showView('songView');
  renderSongView();
}
function cancelEdit() {
  if (editingSongId) { currentSongId = editingSongId; showView('songView'); renderSongView(); }
  else { showView('homeView'); renderHome(); }
}
function deleteCurrentSong() {
  if (!confirm('Delete this song?')) return;
  songs = songs.filter(s => s.id !== currentSongId);
  saveSongs();
  closeSong();
}

document.getElementById('searchInput').addEventListener('input', renderHome);

loadSongs();
renderHome();
</script>
</body>
